name: Build click

on:
  # Manuell starten: GitHub -> Actions -> "Build click" -> "Run workflow"
  workflow_dispatch:
    inputs:
      release:
        description: "Ergebnis als GitHub-Release veröffentlichen"
        type: boolean
        default: false
  # Tag pushen (git tag v0.1.0 && git push --tags) -> Build + Release
  push:
    tags: ['v*']

permissions:
  contents: write          # nötig zum Anlegen von Releases

concurrency:
  group: build-click-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # Clickable baut in seinem Docker-Image (Ubuntu Touch SDK 20.04, arm64)
      # wie lokal mit "clickable build".
      - name: Install clickable
        run: |
          pipx install clickable-ut
          clickable --version

      - name: Build click (arm64)
        run: clickable build --arch arm64 --non-interactive

      - name: Collect click
        id: click
        run: |
          mkdir -p dist
          cp build/aarch64-linux-gnu/app/*.click dist/
          (cd dist && sha256sum *.click > SHA256SUMS)
          ls -lh dist
          echo "version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubdmr-${{ steps.click.outputs.version }}-arm64
          path: dist/
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-$(date -u +%Y%m%d-%H%M)"
          fi
          cat > notes.md <<EOF
          ubDMR ${{ steps.click.outputs.version }} für Ubuntu Touch (arm64, 20.04 / 24.04), gebaut von Commit ${GITHUB_SHA::7}.

          **Installieren** (Telefon per USB, Entwicklermodus an):
          \`\`\`bash
          adb push ubdmr_*_arm64.click /home/phablet/Downloads/
          adb shell pkcon install-local --allow-untrusted /home/phablet/Downloads/ubdmr_*_arm64.click
          \`\`\`
          Oder die .click-Datei auf dem Telefon mit dem OpenStore öffnen.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ubDMR $TAG" \
            --notes-file notes.md
